<template>
  <style>
    @font-face {
      font-family: "Barlow Condensed";
      font-style: normal;
      font-weight: 900;
      font-display: block;
      src: url("assets/fonts/barlow-condensed-900.woff2") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("assets/fonts/barlow-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2");
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    .f06-ground { position: absolute; inset: 0; background: #080b0f; }

    /* ------------------------------------------------------------------
       COVER SLOT.
       assets/cover.png is not on disk yet, so this renders a stand-in that
       reproduces the real cover's motif (chain-X + ember burst on stone).
       TO SWAP IN THE REAL COVER: drop the file at assets/cover.png, then
       replace the whole #f06-cover <div> with:
         <img id="f06-cover" class="clip" src="assets/cover.png"
              data-start="0" data-duration="5" data-track-index="1"
              style="position:absolute;left:280px;top:200px;width:520px;
                     height:780px;object-fit:cover;border:1px solid #282726;" />
       ------------------------------------------------------------------ */
    .f06-cover {
      position: absolute;
      left: 280px;
      top: 200px;
      width: 520px;
      height: 780px;
      border: 1px solid #282726;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 50% at 45% 42%, rgba(78, 92, 108, 0.2) 0%, rgba(8, 11, 20, 0) 72%),
        #0c1017;
    }

    .f06-coversvg { position: absolute; inset: 0; width: 520px; height: 780px; }

    .f06-coverburst {
      position: absolute;
      left: 260px;
      top: 390px;
      width: 340px;
      height: 340px;
      margin-left: -170px;
      margin-top: -170px;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(255, 250, 236, 0.97) 0%,
        rgba(232, 162, 61, 0.82) 11%,
        rgba(217, 131, 36, 0.45) 25%,
        rgba(217, 131, 36, 0) 60%
      );
    }

    /* Burst geometry, flattened into a line. */
    .f06-divider {
      position: absolute;
      left: 288px;
      top: 1050px;
      width: 504px;
      height: 2px;
      transform-origin: 50% 50%;
      background: linear-gradient(
        90deg,
        rgba(217, 131, 36, 0) 0%,
        #d98324 12%,
        #e8a23d 50%,
        #d98324 88%,
        rgba(217, 131, 36, 0) 100%
      );
    }

    .f06-title {
      position: absolute;
      left: 90px;
      top: 1104px;
      width: 900px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 97px;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: #f2eee6;
      text-transform: lowercase;
      text-align: center;
    }

    .f06-cta {
      position: absolute;
      left: 90px;
      top: 1372px;
      width: 900px;
      font-family: "Barlow", sans-serif;
      font-weight: 400;
      font-size: 35px;
      line-height: 1.35;
      color: #c6ccd5;
      text-align: center;
    }

    .f06-kicker {
      position: absolute;
      left: 90px;
      top: 1452px;
      width: 900px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.14em;
      color: #d98324;
      text-transform: uppercase;
      text-align: center;
    }
  </style>

  <div id="root" data-composition-id="06-endcard" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="clip f06-ground" id="f06-ground" data-start="0" data-duration="5" data-track-index="0"></div>

    <div class="clip f06-cover" id="f06-cover" data-start="0" data-duration="5" data-track-index="1">
      <svg class="f06-coversvg" viewBox="0 0 520 780" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="f06-iron" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8A97A6" />
            <stop offset="30%" stop-color="#4A5563" />
            <stop offset="66%" stop-color="#252D38" />
            <stop offset="100%" stop-color="#141A22" />
          </linearGradient>
        </defs>
        <g id="f06-coverlinks" data-layout-allow-overflow></g>
      </svg>
      <div class="f06-coverburst"></div>
    </div>

    <div class="clip f06-divider" id="f06-divider" data-start="0" data-duration="5" data-track-index="2"></div>

    <div class="clip f06-title" id="f06-title" data-start="0" data-duration="5" data-track-index="3">
      the 90-day battle plan
    </div>

    <div class="clip f06-cta" id="f06-cta" data-start="0" data-duration="5" data-track-index="4">
      Quit for good in 90 days — link in bio.
    </div>

    <div class="clip f06-kicker" id="f06-kicker" data-start="0" data-duration="5" data-track-index="5">
      stan.store/battleplan
    </div>
  </div>

  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";

      // Same chain-X, third and final appearance — now as cover art.
      var g = document.getElementById("f06-coverlinks");
      if (g) {
        var CX = 260, CY = 390;
        var RAYS = [90, 270, 30, 150, 210, 330];
        for (var r = 0; r < RAYS.length; r++) {
          var a = (RAYS[r] * Math.PI) / 180;
          var dx = Math.cos(a), dy = -Math.sin(a);
          for (var i = 1; i <= 12; i++) {
            var d = i * 40;
            var edgeOn = i % 2 === 1;
            var w = edgeOn ? 12 : 29;
            var rect = document.createElementNS(NS, "rect");
            rect.setAttribute("x", String(-w / 2));
            rect.setAttribute("y", "-25");
            rect.setAttribute("width", String(w));
            rect.setAttribute("height", "50");
            rect.setAttribute("rx", String(w / 2));
            rect.setAttribute("ry", String(w / 2));
            rect.setAttribute("fill", "none");
            rect.setAttribute("stroke", "url(#f06-iron)");
            rect.setAttribute("stroke-width", edgeOn ? "5.5" : "7");
            var falloff = 1 - Math.min(1, (d - 40) / 460) * 0.5;
            rect.setAttribute("opacity", falloff.toFixed(3));
            rect.setAttribute(
              "transform",
              "translate(" + (CX + dx * d).toFixed(2) + "," + (CY + dy * d).toFixed(2) +
                ") rotate(" + (90 - RAYS[r]).toFixed(2) + ")"
            );
            g.appendChild(rect);
          }
        }
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      gsap.set("#f06-divider", { scaleX: 0, opacity: 1 });
      gsap.set(["#f06-title", "#f06-cta", "#f06-kicker"], { opacity: 0 });

      // Scene 1 (0.0-0.5s) — spring-pop-entrance. The one restrained move.
      tl.fromTo("#f06-cover",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.4)" }, 0);

      // Scene 2 (0.5-1.1s) — svg-path-draw, centre-out.
      tl.to("#f06-divider", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.5);

      // Scene 3 (1.1-1.9s) — kinetic-beat-slam.
      tl.fromTo("#f06-title",
        { opacity: 0, y: 20, scale: 1.03 },
        { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power4.out" }, 1.1);

      // Scene 4 (1.9-2.6s) — discrete-text-sequence.
      tl.fromTo("#f06-cta",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 1.9);
      tl.fromTo("#f06-kicker",
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "none" }, 2.2);

      // Scene 5 (2.6-5.0s) — full hold. Stillness is the payload; only a
      // barely-there bloom on the divider. Final frame, so a settle is allowed.
      tl.to("#f06-divider", { opacity: 0.9, duration: 1.2, ease: "sine.inOut" }, 2.6);
      tl.to("#f06-divider", { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 3.8);

      window.__timelines["06-endcard"] = tl;
    })();
  </script>
</template>
