<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #080B0F;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-you-meant-it"
        class="scene"
        data-composition-id="01-you-meant-it"
        data-composition-src="compositions/frames/01-you-meant-it.html"
        data-start="0"
        data-duration="2"
        data-track-index="0"
      ></div>

      <div
        id="el-02-here-again"
        class="scene"
        data-composition-id="02-here-again"
        data-composition-src="compositions/frames/02-here-again.html"
        data-start="2"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-chains"
        class="scene"
        data-composition-id="03-chains"
        data-composition-src="compositions/frames/03-chains.html"
        data-start="5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-break"
        class="scene"
        data-composition-id="04-break"
        data-composition-src="compositions/frames/04-break.html"
        data-start="9"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-the-plan"
        class="scene"
        data-composition-id="05-the-plan"
        data-composition-src="compositions/frames/05-the-plan.html"
        data-start="12"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-endcard"
        class="scene"
        data-composition-id="06-endcard"
        data-composition-src="compositions/frames/06-endcard.html"
        data-start="17"
        data-duration="5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="22"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-here-again", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-03-chains", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-04-break", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-05-the-plan", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to({}, { duration: 22 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
